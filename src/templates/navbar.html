<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'posts:main-board' %}">Posts-proj</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{% url 'posts:main-board' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/profiles/my/' %}active{% endif %}" href="{% url 'profiles:my-profile' %}">My Profile</a>
                </li>
            </ul>
            <!-- beyond the course: show who is logged in and allow logging out -->
            {% if user.is_authenticated %}
                <div class="ms-auto d-flex align-items-center">
                    <span class="navbar-text me-3">Logged in as <b>{{ user.username }}</b></span>
                    <form id="logout-form" method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
                    </form>
                </div>
            {% endif %}
        </div>
    </div>
</nav>
